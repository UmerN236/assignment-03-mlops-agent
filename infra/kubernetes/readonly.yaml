apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-reader
  namespace: mlops-agent
  labels:
    app.kubernetes.io/part-of: mlops-assignment3
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agent-reader
  namespace: mlops-agent
  labels:
    app.kubernetes.io/part-of: mlops-assignment3
rules:
- apiGroups:
  - ''
  resources:
  - pods
  - pods/log
  - services
  - events
  verbs:
  - get
  - list
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - get
  - list
- apiGroups:
  - discovery.k8s.io
  resources:
  - endpointslices
  verbs:
  - get
  - list
- apiGroups:
  - ''
  resources:
  - services/proxy
  resourceNames:
  - inference:http
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agent-reader
  namespace: mlops-agent
  labels:
    app.kubernetes.io/part-of: mlops-assignment3
subjects:
- kind: ServiceAccount
  name: agent-reader
  namespace: mlops-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: agent-reader
