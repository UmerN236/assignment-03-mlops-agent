apiVersion: v1
kind: ConfigMap
metadata:
  name: inference-config
  namespace: mlops-agent
  labels:
    app.kubernetes.io/part-of: mlops-assignment3
data:
  MODEL_BUNDLE_PATH: /app/model
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: inference
  namespace: mlops-agent
  labels:
    app.kubernetes.io/part-of: mlops-assignment3
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference
  namespace: mlops-agent
  labels:
    app.kubernetes.io/name: inference
    app.kubernetes.io/part-of: mlops-assignment3
spec:
  replicas: 2
  revisionHistoryLimit: 2
  progressDeadlineSeconds: 180
  selector:
    matchLabels:
      app.kubernetes.io/name: inference
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: inference
        app.kubernetes.io/part-of: mlops-assignment3
    spec:
      serviceAccountName: inference
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: inference
        image: mlops-assignment3-inference:c20e0106c52d
        imagePullPolicy: Never
        ports:
        - name: http
          containerPort: 8000
        envFrom:
        - configMapRef:
            name: inference-config
        resources:
          requests:
            cpu: 100m
            memory: 192Mi
          limits:
            cpu: '1'
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        startupProbe:
          httpGet:
            path: /livez
            port: http
          periodSeconds: 2
          failureThreshold: 45
        livenessProbe:
          httpGet:
            path: /livez
            port: http
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /readyz
            port: http
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: inference
  namespace: mlops-agent
  labels:
    app.kubernetes.io/name: inference
    app.kubernetes.io/part-of: mlops-assignment3
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: inference
  ports:
  - name: http
    port: 8000
    targetPort: http
