name: mlops-assignment3
services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.6.0@sha256:864952c525845f9717b8323613659e5606cd6378f3dca2d70a5d7613821852fd
    container_name: mlops-assignment3-mlflow
    depends_on:
      storage-init:
        condition: service_completed_successfully
    command:
      - mlflow
      - server
      - --host=0.0.0.0
      - --port=5000
      - --backend-store-uri=sqlite:////mlflow/mlflow.db
      - --artifacts-destination=/mlflow/artifacts
      - --serve-artifacts
      - --allowed-hosts=localhost:*,127.0.0.1:*,mlflow:*
    ports: ["127.0.0.1:5000:5000"]
    volumes: ["mlflow-data:/mlflow"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 12
    mem_limit: 1g
  storage-init:
    image: apache/airflow:3.1.3-python3.12@sha256:94096e4d3f8819f96b2f37c182d734cc45b6a096080015d6b5978c8a4d3295ba
    container_name: mlops-assignment3-storage-init
    user: "0:0"
    entrypoint: ["python", "/bootstrap/init-service-storage.py"]
    environment:
      LOCAL_UID: "${LOCAL_UID:?Use make services}"
    volumes:
      - airflow-data:/opt/airflow
      - mlflow-data:/mlflow
      - ../.local/runtime/airflow:/previous-airflow:ro
      - ../.local/runtime/mlflow:/previous-mlflow:ro
      - ../scripts/init-service-storage.py:/bootstrap/init-service-storage.py:ro
  airflow:
    image: apache/airflow:3.1.3-python3.12@sha256:94096e4d3f8819f96b2f37c182d734cc45b6a096080015d6b5978c8a4d3295ba
    container_name: mlops-assignment3-airflow
    user: "${LOCAL_UID:?Use make services}:0"
    command: standalone
    depends_on:
      storage-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW_HOME: /opt/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: "admin:admin"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/project/infra/airflow/dags
      AIRFLOW__CORE__PARALLELISM: "2"
      AIRFLOW__API__WORKERS: "1"
      AIRFLOW__API__BASE_URL: http://localhost:8080
      MLFLOW_TRACKING_URI: http://mlflow:5000
    ports: ["127.0.0.1:8080:8080"]
    volumes:
      - airflow-data:/opt/airflow
      - ../.local/runtime/airflow/simple_auth_manager_passwords.json.generated:/opt/airflow/simple_auth_manager_passwords.json.generated
      - ../src:/opt/project/src:ro
      - ./airflow/dags:/opt/project/infra/airflow/dags:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import json, urllib.request; h=json.load(urllib.request.urlopen('http://127.0.0.1:8080/api/v2/monitor/health', timeout=5)); assert all(h.get(k, {}).get('status') == 'healthy' for k in ('metadatabase', 'scheduler', 'triggerer', 'dag_processor'))"]
      interval: 15s
      timeout: 6s
      retries: 20
      start_period: 30s
    mem_limit: 3g
volumes:
  airflow-data:
    name: mlops-assignment3-airflow-data
  mlflow-data:
    name: mlops-assignment3-mlflow-data
